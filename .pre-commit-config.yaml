repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-em-dash
        name: No em-dashes
        language: pygrep
        entry: "\u2014"
        files: \.(py|md|txt|toml|yaml|yml|json|rst)$
        types_or: [python, markdown, plain-text]
      - id: basedpyright
        name: basedpyright
        language: system
        entry: uv run basedpyright
        args: ["tests/"]
        types: [python]
        pass_filenames: false
