[project]
name = "image-generation"
version = "0.1.0"
description = "Gemini and Topaz Labs image generation and enhancement tools"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Byron Williams", email = "byronawilliams@gmail.com"}]
requires-python = ">=3.10,<3.15"
dependencies = [
    "google-genai>=2.2.0,<2.3.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    # Upper bound on next major; structlog processors and renderers form a
    # contract that historically changes at major versions, and silent log
    # misconfiguration is the most likely failure mode.
    "structlog>=24.0.0,<26.0.0",
    # Pinned to address CVE-2026-44431 (sensitive header leak on proxied
    # low-level redirects) and CVE-2026-44432 (decompression-bomb safeguard
    # bypass in streaming API). Both fixed in 2.7.0. urllib3 may still be
    # pulled transitively by other dependencies; the explicit pin ensures the
    # resolver picks a patched version regardless.
    "urllib3>=2.7.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/williaby/image-generation"
"Bug Tracker" = "https://github.com/williaby/image-generation/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "basedpyright>=1.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.5",
    "pip-audit>=2.7.0",
    "hypothesis>=6.0.0,<7.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# PyStrict-aligned rule set. Each code block adds a coherent slice of checks;
# new codes were added during the 2026-05 compliance audit (TOOL-RUF-001).
select = [
    "E", "F", "W",          # pycodestyle + pyflakes
    "I",                       # isort
    "RUF",                     # ruff-specific
    "UP",                      # pyupgrade
    "B",                       # flake8-bugbear
    "C4",                      # flake8-comprehensions
    "SIM",                     # flake8-simplify
    "BLE",                     # blind-except
    "EM",                      # error message formatting
    "SLF",                     # private-member access
    "INP",                     # implicit namespace packages
    "ISC",                     # implicit string concatenation
    "PGH",                     # pygrep-hooks
    "RSE",                     # raise statement style
    "TID",                     # tidy imports
    "YTT",                     # sys.version_info misuse
    "FA",                      # future-annotations
    "T10",                     # debugger imports
    "G",                       # logging format
    "ANN",                     # type annotations
    "TCH",                     # typing imports under TYPE_CHECKING
    "FBT",                     # boolean-trap arguments
    "TRY",                     # exception-handling antipatterns
    "ERA",                     # commented-out code
    "FURB",                    # refurb modernizations
    "LOG",                     # logging best practices
    "ASYNC",                   # async correctness
    # Added in 2026-05 compliance audit (GCA-001) to reach PyStrict alignment:
    "N",                       # pep8-naming
    "D",                       # docstring conventions
    "C90",                     # McCabe complexity
    "PL",                      # Pylint
    "S",                       # flake8-bandit (security)
    "T20",                     # flake8-print
    "Q",                       # flake8-quotes
    "PTH",                     # pathlib
    "A",                       # builtins shadowing
    "DTZ",                     # timezone-aware datetime
    "PERF",                    # performance anti-patterns
    "ARG",                     # unused arguments
    "RET",                     # return style
    "PIE",                     # miscellaneous improvements
    "PT",                      # pytest style
]
ignore = [
    "E501",                    # line-length (handled by ruff format)
    # ANN101 / ANN102 (missing-type-self / missing-type-cls) were removed
    # from ruff (>=0.4) because annotations on `self` and `cls` are inferred.
    # Listing them in `ignore` previously triggered a "rules have been
    # removed and ignoring them has no effect" warning on every ruff run.
    "TRY003",                  # long exception messages allowed
    "ISC001",                  # conflicts with ruff format (per ruff docs)
    "D203",                    # conflicts with D211 (no-blank-line-before-class); D211 preferred
    "D213",                    # conflicts with D212 (multi-line-summary-first-line); D212 preferred
    "Q000", "Q001",            # quote style delegated to ruff format
]

# Per-file suppression rationale:
#
# tests/**: Test files use a structural import pattern (deferred imports inside
#   test methods) to avoid module-level side-effects from scripts/generate_image.py.
#   PLC0415 is suppressed repo-wide for tests rather than changed structurally,
#   as the deferred import pattern is intentional. D101/D102/D104 are suppressed
#   because public docstrings on test classes/methods add little value; pytest
#   introspection uses function names for reporting. ARG001/ARG002 are suppressed
#   because pytest fixture parameters appear as "unused" to static analysis.
#
# scripts/generate_image.py: legacy CLI script with extensive boolean flag API,
#   dynamic try/except imports, and complexity that predates current rule set.
#   PTH123 (open() -> Path.open()), C901 (complexity), D* (docstring style),
#   N806 (variable names), PLW2901 (loop var), and ARG001 are all tracked for
#   a dedicated cleanup pass outside this compliance audit (GCA-001 follow-on).
#   T20 (print) is expected for a CLI tool producing user-facing output.
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",                    # asserts are fine in tests
    "ANN",                     # type annotations not required in tests
    "SLF",                     # private member access acceptable in tests
    "FBT",                     # boolean traps acceptable in test parametrization
    "TRY",                     # exception-handling style relaxed in tests
    "PLR2004",                 # magic numbers in test assertions are fine
    "TCH003",                  # typing imports under TYPE_CHECKING unneeded in tests
    "EM",                      # error message construction style relaxed in tests
    "ERA",                     # commented-out reference code allowed in tests
    "FURB",                    # refurb modernizations deferred for tests
    "D",                       # docstring rules relaxed in tests (missing + style)
    "PLC0415",                 # deferred imports inside test methods are intentional
    "ARG001", "ARG002",        # pytest fixture args appear unused to static analysis
]
"scripts/generate_image.py" = [
    "FBT",                     # legacy boolean flag API
    "ANN",                     # full type annotation deferred
    "TRY",                     # exception flow predates TRY rules
    "BLE",                     # blind-except in error reporting paths
    "EM",                      # error-message formatting style legacy
    "PLR",                     # complexity refactor deferred
    "TCH",                     # imports load at module scope by design
    "ERA",                     # commented-out reference code retained
    "T20",                     # CLI tool -- print() is user-facing output, not debug
    "PTH123",                  # pathlib migration deferred to cleanup pass
    "C901",                    # complexity refactor tracked separately
    "D",                       # docstring style cleanup tracked separately
    "N806",                    # variable naming cleanup tracked separately
    "PLW2901",                 # loop variable overwrite tracked separately
    "ARG001",                  # unused arg tracked separately
    "ARG002",                  # unused method args (structlog logger shim methods)
    "G004",                    # f-string in log call; structlog renderer handles
                               # interpolation eagerly, so the f-string form is
                               # idiomatic here.
]

[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "strict"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingTypeStubs = false
# basedpyright is stricter than upstream pyright by default; the reportUnknown*
# family fires on pytest fixture parameters whose types are unknown without
# explicit annotation. Disabling these four checks while keeping strict semantics
# elsewhere is a compromise. Re-enable in a follow-up PR once tests/ has full
# parameter annotations.
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportMissingTypeArgument = "none"
reportUntypedFunctionDecorator = "none"
# pytest fixtures and test access patterns trigger these in strict mode; tests
# legitimately exercise private helpers and basedpyright cannot always resolve
# dev-only imports outside the .venv path. Re-enable when the test suite gets
# proper type stubs / a configured venvPath.
reportMissingImports = "none"
reportPrivateUsage = "none"
# scripts/generate_image.py was previously excluded due to 36 pre-existing
# type errors from the dynamic try/except import pattern; those have been
# resolved as part of the 2026-05 compliance sweep (GCA-002).
exclude = ["**/__pycache__", ".worktrees/**"]

[tool.bandit]
# Bandit security scanner. Skipped paths and assertion-only exclusions are
# the standard pattern for application code.
exclude_dirs = ["tests", ".worktrees", ".venv", "build", "dist"]
skips = ["B101"]  # assert statements are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
# Project root on sys.path so `from scripts.generate_image import ...` works
# under bare `pytest` (the org python-compatibility workflow runs
# `uv run pytest` which, unlike `python -m pytest`, does not auto-add CWD to
# sys.path) and when no editable install exists (this project has no
# [build-system], and the workflow runs `uv sync --no-build`, so the project
# is never installed into the test venv).
pythonpath = ["."]
addopts = "--cov=scripts --cov-report=term-missing --cov-branch"

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
# Branch threshold enforced separately in CI; see .github/workflows/ci.yml
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
