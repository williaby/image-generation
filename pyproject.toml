[project]
name = "image-generation"
version = "0.1.0"
description = "Gemini and Topaz Labs image generation and enhancement tools"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.4.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    # Pinned to address CVE-2026-44431 and CVE-2026-44432 (HIGH);
    # transitive via requests, fixed in 2.7.0.
    "urllib3>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "basedpyright>=1.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
# scripts/generate_image.py excluded: dynamic try/except import pattern produces
# 36 pre-existing type errors; tracked for a dedicated type-annotation pass.
exclude = ["**/__pycache__", ".worktrees/**", "scripts/generate_image.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-report=term-missing --cov-branch"

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
