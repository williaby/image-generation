[project]
name = "image-generation"
version = "0.1.0"
description = "Gemini and Topaz Labs image generation and enhancement tools"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.2.0,<2.3.0",
    "requests>=2.32.0,<3.0.0",
    # Pinned to address CVE-2026-44431 (sensitive header leak on proxied
    # low-level redirects) and CVE-2026-44432 (decompression-bomb safeguard
    # bypass in streaming API). Both fixed in 2.7.0. urllib3 is a transitive
    # dependency via requests; explicit pin ensures the resolver picks a
    # patched version.
    "urllib3>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "basedpyright>=1.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.5",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# PyStrict-aligned rule set. Each code block adds a coherent slice of checks;
# new codes were added during the 2026-05 compliance audit (TOOL-RUF-001).
select = [
    "E", "F", "W",          # pycodestyle + pyflakes
    "I",                       # isort
    "RUF",                     # ruff-specific
    "UP",                      # pyupgrade
    "B",                       # flake8-bugbear
    "C4",                      # flake8-comprehensions
    "SIM",                     # flake8-simplify
    "BLE",                     # blind-except
    "EM",                      # error message formatting
    "SLF",                     # private-member access
    "INP",                     # implicit namespace packages
    "ISC",                     # implicit string concatenation
    "PGH",                     # pygrep-hooks
    "RSE",                     # raise statement style
    "TID",                     # tidy imports
    "YTT",                     # sys.version_info misuse
    "FA",                      # future-annotations
    "T10",                     # debugger imports
    "G",                       # logging format
    "ANN",                     # type annotations
    "TCH",                     # typing imports under TYPE_CHECKING
    "FBT",                     # boolean-trap arguments
    "TRY",                     # exception-handling antipatterns
    "ERA",                     # commented-out code
    "FURB",                    # refurb modernizations
    "LOG",                     # logging best practices
    "ASYNC",                   # async correctness
]
ignore = [
    "E501",                    # line-length (handled by ruff format)
    "ANN101", "ANN102",        # legacy self/cls annotations
    "TRY003",                  # long exception messages allowed
    "ISC001",                  # conflicts with ruff format (per ruff docs)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",                    # asserts are fine in tests
    "ANN",                     # type annotations not required in tests
    "SLF",                     # private member access acceptable in tests
    "FBT",                     # boolean traps acceptable in test parametrization
    "TRY",                     # exception-handling style relaxed in tests
    "PLR2004",                 # magic numbers in test assertions are fine
    "TCH003",                  # typing imports under TYPE_CHECKING unneeded in tests
    "EM",                      # error message construction style relaxed in tests
    "ERA",                     # commented-out reference code allowed in tests
    "FURB",                    # refurb modernizations deferred for tests
]
# scripts/generate_image.py: legacy CLI script with extensive boolean flag API
# and dynamic try/except imports. Same exclusion philosophy as basedpyright.
# A dedicated cleanup pass is tracked outside this compliance audit.
"scripts/generate_image.py" = [
    "FBT",                     # legacy boolean flag API
    "ANN",                     # full type annotation deferred
    "TRY",                     # exception flow predates TRY rules
    "BLE",                     # blind-except in error reporting paths
    "EM",                      # error-message formatting style legacy
    "PLR",                     # complexity refactor deferred
    "TCH",                     # imports load at module scope by design
    "ERA",                     # commented-out reference code retained
]

[tool.basedpyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingTypeStubs = false
# basedpyright is stricter than upstream pyright by default; the reportUnknown*
# family fires on pytest fixture parameters whose types are unknown without
# explicit annotation. Disabling these four checks while keeping strict semantics
# elsewhere is a compromise. Re-enable in a follow-up PR once tests/ has full
# parameter annotations.
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportMissingTypeArgument = "none"
reportUntypedFunctionDecorator = "none"
# pytest fixtures and test access patterns trigger these in strict mode; tests
# legitimately exercise private helpers and basedpyright cannot always resolve
# dev-only imports outside the .venv path. Re-enable when the test suite gets
# proper type stubs / a configured venvPath.
reportMissingImports = "none"
reportPrivateUsage = "none"
# scripts/generate_image.py excluded: dynamic try/except import pattern produces
# 36 pre-existing type errors; tracked under issue TBD for a dedicated
# type-annotation pass. Compliance audit 2026-05-16 noted this exclusion is
# expected to be time-bounded; please open and link a tracking issue.
exclude = ["**/__pycache__", ".worktrees/**", "scripts/generate_image.py"]

[tool.bandit]
# Bandit security scanner. Skipped paths and assertion-only exclusions are
# the standard pattern for application code.
exclude_dirs = ["tests", ".worktrees", ".venv", "build", "dist"]
skips = ["B101"]  # assert statements are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-report=term-missing --cov-branch"

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
