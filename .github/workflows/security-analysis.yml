# Security Analysis Workflow
# Delegates security scans to the org-level reusable workflow.
name: Security Analysis

on:
  merge_group:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly scan on Mondays at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  security:
    name: Security Analysis
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@7d12f5486ab5c856397ebaa4acd3c99ca385227c # main
    with:
      python-version: "3.12"
      # `run-safety` was removed from the org reusable workflow when the
      # CI-005-A SHA bump (799ebd63... -> 8fbdb549...) landed; safety-cli was
      # superseded upstream. Passing it as an input causes a workflow-level
      # `startup_failure` because GitHub strict-validates reusable inputs,
      # which leaves `Security Gate Validation` permanently unreported.
      run-codeql: false
      run-dependency-review: true
      run-osv: false
      # Bandit runs as an explicit, repo-controlled blocking step in ci.yml
      # (python-quality job) using [tool.bandit] in pyproject.toml, so it is
      # left disabled here to avoid a duplicate run with different config.
      run-bandit: false

  security-gate-validation:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    needs: [security]
    if: always()
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - name: Check security scan results
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$SECURITY_RESULT" != "success" ]; then
            echo "::error::Security Gate Validation failed: security scan result is $SECURITY_RESULT"
            exit 1
          fi
          echo "Security Gate Validation passed"
