# Dependency and Standards Validation
#
# Satisfies the "Dependency & Standards Validation" required status check in
# the williaby-default-branch-baseline ruleset (ID 16201085).
#
# Checks performed:
#   - pip-audit: dependency vulnerability scan (confirmed CVEs fail the build)
#   - REUSE compliance: license header validation via fsfe/reuse-action
#   - License file presence: verifies LICENSES/ directory is populated
name: Dependency and Standards Validation

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dep-standards:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Dependency vulnerability audit (pip-audit)
        run: uv run pip-audit

      - name: REUSE license compliance check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5  # v6.0.0

      - name: Verify license files present
        run: |
          if [ ! -d "LICENSES" ] || [ -z "$(ls -A LICENSES/)" ]; then
            echo "::error::LICENSES/ directory is missing or empty."
            exit 1
          fi
          echo "LICENSES/ directory is populated."
