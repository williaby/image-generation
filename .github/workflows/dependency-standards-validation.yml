# Dependency and Standards Validation
#
# Satisfies the "Dependency & Standards Validation" required status check in
# the williaby-default-branch-baseline ruleset (ID 16201085).
#
# Checks performed:
#   - pip-audit: dependency vulnerability scan (confirmed CVEs fail the build)
#   - REUSE compliance: license header validation via fsfe/reuse-action
#   - License file presence: verifies LICENSES/ directory is populated
name: Dependency and Standards Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dep-standards:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Dependency vulnerability audit (pip-audit)
        run: uv run pip-audit

      - name: REUSE license compliance check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5  # v6.0.0

      - name: Verify license files present
        run: |
          if [ ! -d "LICENSES" ] || [ -z "$(ls -A LICENSES/)" ]; then
            echo "::error::LICENSES/ directory is missing or empty."
            exit 1
          fi
          echo "LICENSES/ directory is populated."
