# OpenSSF Scorecard for Claude Code Configuration
# Delegates to the org-level reusable Scorecard workflow.
#
# Dashboard: https://securityscorecards.dev/viewer/?uri=github.com/ByronWilliamsCPA/.claude
# Documentation: https://github.com/ossf/scorecard
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly on Tuesdays at 21:21 UTC
    - cron: '21 21 * * 2'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Limit cache access for the low-trust trigger; the reusable workflow only restores.
cache-mode: read

permissions:
  contents: read

jobs:
  scorecard:
    name: Scorecard Analysis
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    uses: ByronWilliamsCPA/.github/.github/workflows/python-scorecard.yml@79bf84c73af866a34f968262f2631f938c659d77  # main
    with:
      publish-results: true
