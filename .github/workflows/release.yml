# Release Workflow
#
# Creates a GitHub Release with auto-generated release notes whenever a
# semver tag (v*) is pushed. This is a single-script CLI tool with no
# PyPI or package publishing; GitHub Releases provide the version artifact.
name: Release

on:
  push:
    tags:
      - 'v*'

# Top-level permissions default to read-only; the release job opts into
# write scope just for itself, satisfying least-privilege.
permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          generate_release_notes: true
