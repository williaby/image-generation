# Release Workflow
#
# Creates a GitHub Release with auto-generated release notes whenever a
# semver tag (v*) is pushed. This is a single-script CLI tool with no
# PyPI or package publishing; GitHub Releases provide the version artifact.
name: Release

on:
  push:
    tags:
      - 'v*'

# Top-level permissions default to read-only; the release job opts into
# write scope just for itself, satisfying least-privilege.
permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
        with:
          generate_release_notes: true
