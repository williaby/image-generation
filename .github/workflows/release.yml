# Release Workflow
#
# Creates a GitHub Release with auto-generated release notes whenever a
# semver tag (v*) is pushed. This is a single-script CLI tool with no
# PyPI or package publishing; GitHub Releases provide the version artifact.
name: Release

on:
  push:
    tags:
      - 'v*'

# Top-level permissions default to read-only; the release job opts into
# write scope just for itself, satisfying least-privilege.
permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@f3cad8bcbf209fe591aa1823e372c5d96b7fc800  # v2.3.1
        with:
          generate_release_notes: true
