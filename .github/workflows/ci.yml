# CI for image-generation (configuration repo).
#
# This repo is a Claude Code configuration repository, not a Python package.
# It does not have a src/ layout, so the org-level python-ci.yml reusable
# workflow (which assumes src/ exists and runs ruff format --check src/)
# fails on every PR. This workflow replaces it with checks appropriate for
# YAML/Markdown/agent-prompt content, aggregated under the CI Gate required
# status context.
#
# See: docs/superpowers/plans/2026-05-16-reusable-ci-workflow-audit.md
# in ByronWilliamsCPA/.claude for the audit that produced this workflow.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install yamllint
        run: pipx install yamllint
      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .

  no-em-dash:
    name: No Em-Dash Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Scan for U+2014
        run: |
          if grep -rP --exclude-dir=.git --exclude-dir=node_modules \
                      --exclude-dir=.venv --exclude-dir=.worktrees \
                      $'\xe2\x80\x94' .; then
            echo "::error::Em-dash (U+2014) detected. Replace with comma, semicolon, colon, or restructure."
            exit 1
          fi
          echo "No em-dashes found."

  action-lint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d  # v1.72.0
        with:
          fail_level: error
          reporter: github-check
          # SC2129 is a stylistic preference (use { cmd1; cmd2; } >> file
          # instead of repeated >> file). The repo's existing workflows use
          # the latter style; do not fail builds on it. All other shellcheck
          # rules remain active.
          actionlint_flags: -ignore "SC2129"

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [yaml-lint, no-em-dash, action-lint]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - name: Aggregate results
        env:
          YAML_RESULT: ${{ needs.yaml-lint.result }}
          EMDASH_RESULT: ${{ needs.no-em-dash.result }}
          ACTION_RESULT: ${{ needs.action-lint.result }}
        run: |
          echo "yaml-lint: $YAML_RESULT"
          echo "no-em-dash: $EMDASH_RESULT"
          echo "action-lint: $ACTION_RESULT"
          if [ "$YAML_RESULT" != "success" ] \
             || [ "$EMDASH_RESULT" != "success" ] \
             || [ "$ACTION_RESULT" != "success" ]; then
            echo "::error::CI Gate failed: one or more checks did not succeed."
            exit 1
          fi
          echo "CI Gate passed."
