# CI for image-generation (Python script + agents repo).
#
# This repo uses a scripts/ layout (not src/), so the org-level python-ci.yml
# reusable workflow is not used here. All quality gates are inlined.
#
# Jobs:
#   python-quality - ruff format/lint, basedpyright, pytest + coverage, pip-audit
#   yaml-lint      - yamllint across the repo
#   no-em-dash     - prohibits U+2014 in committed files
#   action-lint    - actionlint validates workflow syntax
#   ci-gate        - aggregates all of the above; satisfies "CI Gate" ruleset check
#
# GCA-010: python-quality uploads coverage.xml as artifact "coverage-reports"
# so coverage.yml can download and forward to Qlty.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  python-quality:
    name: Python Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Ruff format check
        run: uv run ruff format --check scripts tests

      - name: Ruff lint
        run: uv run ruff check scripts tests

      - name: Type check (basedpyright)
        run: uv run basedpyright scripts tests

      - name: Run tests with coverage
        # --cov-fail-under makes the 80% gate explicit in CI rather than relying
        # only on [tool.coverage.report] fail_under; both agree at 80.
        run: |
          uv run pytest \
            --cov=scripts \
            --cov=tests \
            --cov-branch \
            --cov-fail-under=80 \
            --cov-report=xml \
            --cov-report=term

      - name: Security scan (bandit)
        # Explicit, repo-controlled bandit run using [tool.bandit] in
        # pyproject.toml. The org reusable security workflow keeps run-bandit
        # disabled; this step is the blocking bandit gate.
        run: uv run bandit -c pyproject.toml -r scripts/

      - name: Docstring coverage (interrogate)
        # Run via uvx as an isolated tool: interrogate depends on `py`
        # (PYSEC-2022-42969, no fix), which must not enter the project env.
        # Version matches the pinned pre-commit hook.
        run: uvx interrogate@1.7.0 --fail-under=80 scripts/

      - name: Secret scan (detect-secrets)
        # Fails if any tracked file contains a secret not recorded in
        # .secrets.baseline. Mirrors the pre-commit detect-secrets hook; run as
        # an isolated tool so it does not enter the project dependency surface.
        # The exclude uses extended regex (-E) so the optional `(.*/)?` prefix
        # also skips a baseline placed in a subdirectory, not just at the root.
        run: |
          git ls-files -z \
            | grep -zvE '^(.*/)?\.secrets\.baseline$' \
            | xargs -0 uvx --from 'detect-secrets==1.5.0' detect-secrets-hook --baseline .secrets.baseline

      - name: Dependency audit (pip-audit)
        # Advisory-only findings are non-blocking; confirmed CVEs fail the build.
        # The --ignore-vuln flag is not used here; any confirmed CVE exits non-zero.
        run: uv run pip-audit

      - name: Upload coverage report
        # Artifact name must match coverage.yml expectations (GCA-010).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-reports
          path: coverage.xml
          retention-days: 7

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Install yamllint
        run: pipx install yamllint
      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .

  no-em-dash:
    name: No Em-Dash Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Scan for U+2014
        run: |
          if grep -rP --exclude-dir=.git --exclude-dir=node_modules \
                      --exclude-dir=.venv --exclude-dir=.worktrees \
                      $'\xe2\x80\x94' .; then
            echo "::error::Em-dash (U+2014) detected. Replace with comma, semicolon, colon, or restructure."
            exit 1
          fi
          echo "No em-dashes found."

  action-lint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d  # v1.72.0
        with:
          fail_level: error
          reporter: github-check
          # Disable shellcheck integration. The embedded shellcheck inside the
          # actionlint Docker image does not honor repo-root .shellcheckrc and
          # raises pre-existing SC2129 errors in unchanged workflows that
          # were tolerated before this CI ever ran. Actionlint's own rules
          # (workflow YAML, expressions, deprecated actions, runner labels)
          # remain active and are the high-signal part of this check.
          actionlint_flags: -shellcheck=

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [python-quality, yaml-lint, no-em-dash, action-lint]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Aggregate results
        env:
          PYTHON_RESULT: ${{ needs.python-quality.result }}
          YAML_RESULT: ${{ needs.yaml-lint.result }}
          EMDASH_RESULT: ${{ needs.no-em-dash.result }}
          ACTION_RESULT: ${{ needs.action-lint.result }}
        run: |
          echo "python-quality: $PYTHON_RESULT"
          echo "yaml-lint: $YAML_RESULT"
          echo "no-em-dash: $EMDASH_RESULT"
          echo "action-lint: $ACTION_RESULT"
          if [ "$PYTHON_RESULT" != "success" ] \
             || [ "$YAML_RESULT" != "success" ] \
             || [ "$EMDASH_RESULT" != "success" ] \
             || [ "$ACTION_RESULT" != "success" ]; then
            echo "::error::CI Gate failed: one or more checks did not succeed."
            exit 1
          fi
          echo "CI Gate passed."
