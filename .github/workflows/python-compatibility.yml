# Python Compatibility Matrix Testing for Claude Code Configuration
# Tests the project across multiple Python versions and operating systems.
#
# This is a thin caller to the org-level reusable workflow.
name: Python Compatibility

on:
  push:
    branches: [main, master]
    paths:
      - 'scripts/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-compatibility.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'scripts/**/*.py'
      - 'tests/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-compatibility.yml'
  schedule:
    # Weekly compatibility check on Sundays at 6 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: python-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Python Compatibility Matrix
    uses: ByronWilliamsCPA/.github/.github/workflows/python-compatibility.yml@62bfd795d1273b4819a3f66aa9cef0b917acb830  # main
    with:
      # Matrix kept in lockstep with pyproject.toml
      # `requires-python = ">=3.10,<3.15"` (widened from `>=3.12` in the
      # 2026-05 compliance sweep, GCA-006). 3.12 and 3.13 are the in-CI cells
      # because both have stable wheels for google-genai, httpx, and pydantic-
      # settings; 3.10/3.11 are supported but only smoke-tested via uv resolves
      # locally to keep the cross-OS matrix tractable.
      python-versions: '["3.12", "3.13"]'
      operating-systems: '["ubuntu-latest"]'
      include-macos: true
      include-windows: true
      source-directory: 'scripts'
      # NOTE: removed the trailing `--ignore=tests/integration --ignore=tests/load -m "not slow and not integration"`
      # on 2026-05-17. The org reusable workflow at python-compatibility.yml@de201234d10d1e0705e259e57e9d63e87a6ae0ac
      # (introduced by PR #25) re-executes test-command through a shell layer that
      # strips inner double quotes, so pytest received `-m not` then treated `slow`
      # as a positional path and exited with code 4. This project has no `slow` or
      # `integration` markers and no tests/integration/ or tests/load/ directories,
      # so the filter and ignores were dead boilerplate. Re-add only after the org
      # workflow quoting is fixed AND this repo introduces those markers.
      test-command: 'pytest tests/ -v --tb=short -x'
      coverage-report: false
      fail-fast: false
      timeout-minutes: 30
